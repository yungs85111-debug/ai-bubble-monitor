  --text-muted: #94A3B8;
  --border-color: #334155;
  --accent-cyan: #38BDF8;
  --accent-purple: #A855F7;
  --accent-amber: #F59E0B;
  --accent-emerald: #10B981;
  --accent-rose: #F43F5E;
  
  --chip-true-bg: rgba(16, 185, 129, 0.15);
  --chip-true-border: #10B981;
  --chip-true-text: #34D399;
  
  --chip-false-bg: rgba(100, 116, 139, 0.15);
  --chip-false-border: #64748B;
  --chip-false-text: #CBD5E1;
  
  --chip-undetermined-bg: rgba(245, 158, 11, 0.15);
  --chip-undetermined-border: #F59E0B;
  --chip-undetermined-text: #FBBF24;

  --font-sans: "IBM Plex Sans KR", sans-serif;
  --font-mono: "Fira Code", monospace;
  --font-display: "Space Grotesk", sans-serif;
  --font-pixel: "Press Start 2P", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Master Header & Controls */
.master-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 18px;
}
.brand-badge {
  background: linear-gradient(135deg, #0EA5E9, #6366F1);
  color: #FFF;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
}
.control-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn {
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
.btn:hover {
  background: #334155;
  border-color: var(--accent-cyan);
  color: #FFF;
}
.btn-primary {
  background: linear-gradient(135deg, #3B82F6, #8B5CF6);
  border: none;
  color: #FFF;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* Mode Switcher Drawer Modal */
.drawer-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.drawer-overlay.active {
  display: block;
  opacity: 1;
}
.drawer-content {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  width: 90%; max-width: 1100px;
  max-height: 85vh;
  background: #0F172A;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 28px;
  overflow-y: auto;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  transition: transform 0.3s ease;
}
.drawer-overlay.active .drawer-content {
  transform: translate(-50%, -50%) scale(1);
}
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}
.drawer-header h2 { font-size: 20px; font-weight: 600; }
.drawer-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
}
.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.mode-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.mode-card:hover {
  border-color: var(--accent-cyan);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
}
.mode-card.active {
  border-color: #8B5CF6;
  background: linear-gradient(145deg, #1E293B, #2D1B4E);
}
.mode-card.active::after {
  content: "ACTIVE";
  position: absolute;
  top: 8px; right: 8px;
  font-size: 9px;
  font-weight: 700;
  background: #8B5CF6;
  color: #FFF;
  padding: 2px 6px;
  border-radius: 4px;
}
.mode-icon { font-size: 28px; margin-bottom: 8px; }
.mode-num { font-family: var(--font-mono); font-size: 11px; color: var(--accent-cyan); font-weight: 600; }
.mode-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.mode-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

/* Main Dashboard Container */
.dashboard-viewport {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 96px;
}

/* Status Chips according to v1.3 Rule R2 / U5 */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font-mono);
  font-weight: 600;
}
.chip-refuted {
  background: var(--chip-true-bg);
  border: 1px solid var(--chip-true-border);
  color: var(--chip-true-text);
}
.chip-confirmed {
  background: rgba(244, 63, 94, 0.15);
  border: 1px solid var(--accent-rose);
  color: #FDA4AF;
}
.chip-undetermined {
  background: var(--chip-undetermined-bg);
  border: 1px dashed var(--chip-undetermined-border);
  color: var(--chip-undetermined-text);
}

/* Replay vs Live Divider according to v1.3 Rule U3 / §19.1 */
.replay-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0 16px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
}
.replay-divider::before, .replay-divider::after {
  content: ""; flex: 1; height: 1px; background: var(--border-color);
}

/* Evidence Drawer Modal (U4 Compliance) */
.evidence-drawer {
  position: fixed;
  top: 0; right: -450px;
  width: 420px; height: 100vh;
  background: #0F172A;
  border-left: 1px solid var(--border-color);
  z-index: 300;
  box-shadow: -10px 0 30px rgba(0,0,0,0.5);
  transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 24px;
  overflow-y: auto;
}
.evidence-drawer.open { right: 0; }
.evidence-drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 16px;
  margin-bottom: 20px;
}
.evidence-section {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
.evidence-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.evidence-val { font-family: var(--font-mono); font-size: 13px; color: var(--accent-cyan); font-weight: 600; }

/* Dynamic Theme Containers (1-20) */
.theme-container { display: none; }
.theme-container.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.mode-1-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 24px; }
.mode-1-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }

.ecg-wave { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent 0%, #00F0FF 50%, transparent 100%); width: 100px; animation: ecgScan 2.5s infinite linear; }

/* MODE 4: Financial Courtroom */
.courtroom { background: #1C1917; border: 2px solid #78350F; border-radius: 12px; padding: 28px; }
.bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }

.defense-box { background: rgba(16, 185, 129, 0.08); border: 1px solid #10B981; border-radius: 8px; padding: 16px; }

/* MODE 5: Cyberpunk Terminal */
.cyber-term { background: #000; border: 1px solid #00FF66; color: #00FF66; font-family: var(--font-mono); padding: 24px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,255,102,0.2); }
.cyber-glitch { font-size: 24px; font-weight: 700; text-shadow: 2px 2px #FF0055, -2px -2px #00FFFF; }

/* MODE 6: Golden Balance Scale */
.scale-wrapper { text-align: center; padding: 24px; }

/* MODE 7: 8-Bit Arcade VS Mode */
.arcade-wrap { background: #111827; border: 4px solid #EC4899; padding: 24px; font-family: var(--font-pixel); color: #FFF; text-align: center; }
.hp-bar-outer { height: 24px; background: #374151; border: 2px solid #FFF; margin-top: 8px; }
.hp-bar-inner { height: 100%; width: 75%; background: linear-gradient(90deg, #10B981, #34D399); }

/* MODE 8: Sci-Fi Starship Control */
.starship-panel { background: radial-gradient(circle at center, #1E1B4B 0%, #0F0E17 100%); border: 1px solid #6366F1; border-radius: 16px; padding: 28px; }
.warp-dial { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #818CF8; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-family: var(--font-mono); font-size: 20px; color: #A5B4FC; }

/* MODE 9: Bloomberg Financial Desk */
.bloomberg-desk { background: #000; color: #FF9900; font-family: var(--font-mono); padding: 20px; border: 1px solid #FF9900; }
.ticker-marquee { background: #111; padding: 8px; border: 1px solid #333; margin-bottom: 16px; overflow: hidden; white-space: nowrap; }

/* MODE 10: Seismic Early Warning */
.seismic-box { background: #180905; border: 1px solid #EF4444; border-radius: 12px; padding: 24px; color: #FCA5A5; }
.richter-scale { height: 16px; background: linear-gradient(90deg, #10B981, #F59E0B, #EF4444); border-radius: 8px; margin: 12px 0; }

.quest-node { background: #1E1B4B; border: 1px solid #6366F1; padding: 12px; border-radius: 8px; margin-bottom: 12px; }

.swiss-poster { background: #F8FAFC; color: #0F172A; padding: 40px; border-radius: 4px; font-family: var(--font-display); }
.swiss-poster h1 { font-size: 48px; font-weight: 700; line-height: 1.0; letter-spacing: -2px; }

.tarot-card { background: linear-gradient(135deg, #2E1065, #3B0764); border: 2px solid #D8B4FE; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: transform 0.4s ease; transform-style: preserve-3d; }

/* MODE 18: Nautical Maritime Compass */

.audio-mixer { background: #18181B; border: 2px solid #71717A; border-radius: 16px; padding: 24px; }
.equalizer-bank { display: flex; justify-content: space-around; align-items: flex-end; height: 140px; margin-top: 20px; }
.eq-bar { width: 18px; background: linear-gradient(0deg, #10B981, #F59E0B, #EF4444); border-radius: 4px; }

</style>

// Sound FX Generator using Web Audio API
function playBeep(freq = 440, type = 'sine', duration = 0.08) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = soundEnabled ? "🔊 사운드 fx: ON" : "🔇 사운드 fx: OFF";
  if (soundEnabled) playBeep(587, 'sine', 0.1);
}
