[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bubble-monitor"
version = "0.1.0"
description = "AI Bubble Debate Monitor - Evidence-based tracking of AI bubble premises"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bubble Monitor Team" }
]
keywords = ["ai", "bubble", "monitor", "sec", "xbrl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "diskcache>=5.6",
    "tenacity>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.9",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
bm = "bm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data",
    "/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
