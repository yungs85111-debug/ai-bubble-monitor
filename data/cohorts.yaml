# Cohort Definitions
# Each cohort is a named group of tickers for analysis

hyper:
  name: "AI Hyperscalers"
  description: "Major cloud/AI infrastructure companies with significant AI capex (includes NVDA)"
  tickers:
    - NVDA   # NVIDIA Corporation (GPU seller, different business model)
    - MSFT   # Microsoft Corporation
    - GOOGL  # Alphabet Inc.
    - META   # Meta Platforms Inc.
    - AMZN   # Amazon.com Inc.
    - AAPL   # Apple Inc.

hyper_buyers:
  name: "AI Hyperscaler Buyers"
  description: "Cloud/AI infrastructure companies that purchase GPUs (excludes NVDA)"
  tickers:
    - MSFT   # Microsoft Corporation
    - GOOGL  # Alphabet Inc.
    - META   # Meta Platforms Inc.
    - AMZN   # Amazon.com Inc.
    - AAPL   # Apple Inc.

neo:
  name: "AI Neo-Capex"
  description: "AI-focused companies with heavy infrastructure investment"
  tickers:
    - NVDA   # NVIDIA Corporation
    - AMD    # Advanced Micro Devices
    - AVGO   # Broadcom Inc.
    - INTC   # Intel Corporation
    - QCOM   # Qualcomm Inc.
    - TSM    # Taiwan Semiconductor (ADR)

semis:
  name: "Semiconductor Supply Chain"
  description: "Semiconductor manufacturers and equipment suppliers"
  tickers:
    - NVDA
    - AMD
    - INTC
    - AVGO
    - QCOM
    - TSM
    - ASML   # ASML Holding
    - LRCX   # Lam Research
    - AMAT   # Applied Materials
    - MU     # Micron Technology
